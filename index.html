<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nilai Siswa</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mu:#667085;--bd:#e1e5ec;--ac:#2563eb;--wn:#d97706}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b2029;--tx:#e8ebf1;--mu:#98a2b3;--bd:#2c3340;--ac:#6b9bff;--wn:#fbbf24}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}h1{font-size:20px;margin:0 0 12px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 12px}
button{cursor:pointer}button.on,button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.big{font-size:44px;font-weight:700;line-height:1;margin:6px 0}.mu{color:var(--mu);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.grid>div{border:1px solid var(--bd);border-radius:10px;padding:10px}.grid b{font-size:22px;display:block}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:720px}
th,td{border:1px solid var(--bd);padding:4px 6px;text-align:center}th{font-size:13px;background:var(--bg)}
td.n{text-align:left;white-space:nowrap}td input{width:54px;padding:4px;text-align:center}
.hide{display:none}.err{color:var(--wn)}
</style></head><body><main>
<h1>📘 Nilai Siswa</h1>
<div class="tabs"><button id="tS" class="on">Siswa</button><button id="tG">Guru</button></div>

<section id="vS">
 <div class="card"><label class="mu">Pilih nama</label>
 <select id="sel" style="width:100%;margin-top:6px"><option>Memuat…</option></select></div>
 <div id="out"></div>
 <p class="mu">Nilai akhir = rata-rata tugas utama + tugas tambahan (maks. 25), maksimal 100.</p>
</section>

<section id="vG" class="hide">
 <div id="login" class="card">
  <label class="mu">Password guru</label><br>
  <input id="pw" type="password" style="margin:6px 8px 0 0"><button class="pri" id="go">Masuk</button>
  <p id="lerr" class="err"></p>
 </div>
 <div id="panel" class="hide card">
  <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><button class="pri" id="save">Simpan perubahan</button><span id="st" class="mu"></span></div>
  <div class="wrap"><table><thead><tr><th>Nama</th><th>U1</th><th>U2</th><th>U3</th><th>U4</th><th>T1</th><th>T2</th><th>T3</th><th>T4</th><th>T5</th><th>Akhir</th></tr></thead><tbody id="tb"></tbody></table></div>
  <p class="mu">U = tugas utama, T = tugas tambahan. Kosong = belum ada nilai (0 tetap dihitung).</p>
 </div>
</section>
</main>
<script>
const API_URL = 'GANTI_DENGAN_URL_WEB_APP_APPS_SCRIPT';
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const num = v => (v === '' || v == null || isNaN(+v)) ? null : +v;
const avg = a => { a = a.map(num).filter(x => x !== null); return a.length ? a.reduce((p, c) => p + c, 0) / a.length : null };
const r = x => Math.round(x * 100) / 100;
const akhir = (u, t) => { const ru = avg(u) || 0, rt = avg(t); return Math.min(ru + (rt === null ? 0 : Math.min(rt, 25)), 100) };
function tab(g){ $('vS').classList.toggle('hide', g); $('vG').classList.toggle('hide', !g); $('tS').classList.toggle('on', !g); $('tG').classList.toggle('on', g) }
$('tS').onclick = () => tab(false); $('tG').onclick = () => tab(true);

// ---- Siswa
fetch(API_URL).then(r => r.json()).then(d => {
  $('sel').innerHTML = '<option value="">— pilih nama —</option>' + d.names.map(n => `<option>${esc(n)}</option>`).join('');
}).catch(() => $('sel').innerHTML = '<option>Gagal memuat data</option>');
$('sel').onchange = async () => {
  const n = $('sel').value; if (!n) { $('out').innerHTML = ''; return }
  $('out').innerHTML = '<p class="mu">Memuat…</p>';
  const d = await (await fetch(API_URL + '?action=nilai&nama=' + encodeURIComponent(n))).json();
  if (!d.ok) { $('out').innerHTML = `<p class="err">${esc(d.error)}</p>`; return }
  const f = v => num(v) === null ? '–' : v, h = d.hasil;
  $('out').innerHTML = `<div class="card"><div class="mu">${esc(d.nama)}</div><div class="big">${h.akhir}</div><div class="mu">Nilai akhir</div>
  <div class="grid"><div><span class="mu">Tugas utama (rata-rata)</span><b>${h.rataUtama}</b>${d.u.map((v, i) => `<span class="mu">${i + 1}: ${f(v)} </span>`).join('')}</div>
  <div><span class="mu">Tugas tambahan (maks. 25)</span><b>+${h.tambahan}</b>${d.t.map((v, i) => `<span class="mu">${i + 1}: ${f(v)} </span>`).join('')}</div></div></div>`;
};

// ---- Guru
let pass = '', rows = [], dirty = new Set();
const post = body => fetch(API_URL, { method: 'POST', body: JSON.stringify({ password: pass, ...body }) }).then(r => r.json());
$('go').onclick = async () => {
  pass = $('pw').value; $('lerr').textContent = 'Memeriksa…';
  const d = await post({ action: 'list' }).catch(() => ({ error: 'Koneksi gagal' }));
  if (!d.ok) { $('lerr').textContent = d.error; pass = ''; return }
  rows = d.rows; $('login').classList.add('hide'); $('panel').classList.remove('hide'); draw();
};
$('pw').onkeydown = e => { if (e.key === 'Enter') $('go').click() };
function draw(){
  $('tb').innerHTML = rows.map((s, i) => `<tr><td class="n">${esc(s.nama)}</td>` +
    s.u.map((v, k) => `<td><input data-i="${i}" data-g="u" data-k="${k}" value="${v}"></td>`).join('') +
    s.t.map((v, k) => `<td><input data-i="${i}" data-g="t" data-k="${k}" value="${v}"></td>`).join('') +
    `<td id="a${i}"><b>${r(akhir(s.u, s.t))}</b></td></tr>`).join('');
}
$('tb').oninput = e => {
  const t = e.target; if (!t.dataset.g) return;
  const v = t.value.replace(',', '.').trim();
  if (v !== '' && (isNaN(+v) || +v < 0 || +v > 100)) { t.style.borderColor = 'var(--wn)'; return }
  t.style.borderColor = ''; const s = rows[t.dataset.i];
  s[t.dataset.g][t.dataset.k] = v === '' ? '' : +v; dirty.add(+t.dataset.i);
  $('a' + t.dataset.i).innerHTML = `<b>${r(akhir(s.u, s.t))}</b>`; $('st').textContent = dirty.size + ' baris belum disimpan';
};
$('save').onclick = async () => {
  if (!dirty.size) return; $('st').textContent = 'Menyimpan…';
  const changes = [...dirty].map(i => ({ row: rows[i].row, u: rows[i].u, t: rows[i].t }));
  const d = await post({ action: 'save', changes }).catch(() => ({ error: 'Koneksi gagal' }));
  if (d.ok) { dirty.clear(); $('st').textContent = 'Tersimpan ✓' } else $('st').textContent = 'Gagal: ' + d.error;
};
</script></body></html>
